name: Build & push

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Defaults to commit SHA."
        required: false

jobs:
  build-push:
    name: Build & push
    runs-on: alpine-docker
    env:
      DOCKER_HOST: tcp://localhost:2375
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: apk add --no-cache curl jq

      - name: Build Docker image & extract binaries
        run: |
          docker build \
            -t zitadel-cli:latest \
            -t forge.mrs.aager.de/${{ github.repository }}:latest \
            -t forge.mrs.aager.de/${{ github.repository }}:${{ github.sha }} \
            .
          mkdir -p dist
          docker run --rm zitadel-cli:latest cat /usr/local/bin/zitadel > dist/zitadel
          docker run --rm zitadel-cli:latest cat /usr/local/bin/zitadel-mcp > dist/zitadel-mcp
          chmod +x dist/zitadel dist/zitadel-mcp

      - name: Create release & upload binaries
        if: ${{ secrets.CI_TOKEN != '' }}
        run: |
          TAG="${{ inputs.tag || github.sha }}"
          REPO="${{ github.repository }}"
          API="https://forge.mrs.aager.de/api/v1/repos/${REPO}/releases"

          curl -s -X DELETE "${API}/tags/${TAG}" \
            -H "Authorization: token ${{ secrets.CI_TOKEN }}" > /dev/null 2>&1 || true

          RELEASE_JSON=$(curl -s -X POST "${API}" \
            -H "Authorization: token ${{ secrets.CI_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"Release ${TAG}\"}")
          RELEASE_ID=$(echo "${RELEASE_JSON}" | jq -r '.id')

          for f in dist/zitadel dist/zitadel-mcp; do
            curl -s -X POST "${API}/${RELEASE_ID}/assets" \
              -H "Authorization: token ${{ secrets.CI_TOKEN }}" \
              -F "attachment=@${f}"
          done
          echo "Release ${TAG} created with binaries"

      - name: Push Docker image
        if: ${{ secrets.CI_TOKEN != '' }}
        run: |
          echo "${{ secrets.CI_TOKEN }}" | docker login forge.mrs.aager.de \
            --username ${{ github.actor }} --password-stdin
          docker push forge.mrs.aager.de/${{ github.repository }}:latest
          docker push forge.mrs.aager.de/${{ github.repository }}:${{ github.sha }}
