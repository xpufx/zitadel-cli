name: Build & push

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Defaults to commit SHA."
        required: false

jobs:
  build-push:
    name: Build & push
    runs-on: alpine-docker
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t zitadel-cli:latest \
            -t forge.mrs.uppidi.com/${{ github.repository }}:latest \
            -t forge.mrs.uppidi.com/${{ github.repository }}:${{ github.sha }} \
            .

      - name: Create release & upload binaries
        if: ${{ secrets.CI_TOKEN != '' }}
        run: |
          TAG="${{ inputs.tag || github.sha }}"
          REPO="${{ github.repository }}"
          API="https://forge.mrs.uppidi.com/api/v1/repos/${REPO}/releases"
          AUTH="Authorization: token ${{ secrets.CI_TOKEN }}"

          # Delete existing tag release if present
          docker run --rm curlimages/curl -s -X DELETE "${API}/tags/${TAG}" \
            -H "${AUTH}" > /dev/null 2>&1 || true

          # Create release
          RELEASE_JSON=$(docker run --rm curlimages/curl -s -X POST "${API}" \
            -H "${AUTH}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"Release ${TAG}\"}")
          RELEASE_ID=$(echo "${RELEASE_JSON}" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).id))")

          # Upload binaries by piping from the zitadel-cli image directly
          for name in zitadel zitadel-mcp; do
            docker run --rm zitadel-cli:latest cat "/usr/local/bin/${name}" | \
              docker run --rm -i curlimages/curl -s -X POST \
                "${API}/${RELEASE_ID}/assets?name=${name}" \
                -H "${AUTH}" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @-
          done
          echo "Release ${TAG} created with binaries"

      - name: Push Docker image
        if: ${{ secrets.CI_TOKEN != '' }}
        run: |
          echo "${{ secrets.CI_TOKEN }}" | docker login forge.mrs.uppidi.com \
            --username ${{ github.actor }} --password-stdin
          docker push forge.mrs.uppidi.com/${{ github.repository }}:latest
          docker push forge.mrs.uppidi.com/${{ github.repository }}:${{ github.sha }}
